<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ऋतुजा पब्लिकेशन | Rutuja Publication</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<meta name="description" content="इयत्ता १ ते ५ साठी मराठी, सेमी-इंग्रजी आणि इंग्रजी माध्यमाची पुस्तके. Rutuja Publication, Padhegaon, Shrirampur, Ahilyanagar, Maharashtra.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Mukta:wght@300;400;500;600;700&family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=15b">
</head>
<body>

<!-- ================= SCREEN 1 — WELCOME ================= -->

<!-- ================= THE FORM ================= -->
<template id="formTemplate">
  <form id="gateForm" autocomplete="on" novalidate>
    <input type="text" name="website" id="hp" tabindex="-1" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0">
    <div class="gate-note gate-note-warn hidden" id="parentNote" data-t="gate_parent_note"></div>

    <div class="f"><label data-t="gate_name"></label>
      <input type="text" id="gName" maxlength="80"><span class="err" id="eName"></span></div>

    <div class="f"><label data-t="gate_whatsapp"></label>
      <div class="phone-row"><span class="phone-cc">+91</span>
        <input type="tel" id="gPhone" inputmode="numeric" maxlength="10"></div>
      <span class="err" id="ePhone"></span></div>

    <div class="f"><label data-t="gate_category"></label>
      <span class="sel"><span class="sel"><select id="gCat"></select></span></span><span class="err" id="eCat"></span></div>

    <div class="f-row">
      <div class="f"><label data-t="gate_state"></label>
        <span class="sel"><select id="gState"></select></span><span class="err" id="eState"></span></div>
      <div class="f"><label data-t="gate_district"></label>
        <span class="sel" id="wDist"><select id="gDist"></select></span>
        <input type="text" id="gDistT" class="hidden" maxlength="40">
        <span class="err" id="eDist"></span></div>
    </div>

    <div class="f-row">
      <div class="f"><label data-t="gate_taluka"></label>
        <span class="sel" id="wTal"><select id="gTal"></select></span>
        <input type="text" id="gTalT" class="hidden" maxlength="40">
        <span class="err" id="eTal"></span></div>
      <div class="f"><label data-t="gate_village"></label>
        <input type="text" id="gVillage" maxlength="60"><span class="err" id="eVillage"></span></div>
    </div>

    <div class="f"><label data-t="gate_pin"></label>
      <input type="text" id="gPin" inputmode="numeric" maxlength="6"><span class="err" id="ePin"></span></div>

    <p class="flow-note flow-note-ok flow-note-tight hidden" id="prefillNote"><span class="flow-ico" aria-hidden="true"></span><span data-t="prefill_check"></span></p>
    <div class="gate-acts" data-step="st_o_send">
      <button type="submit" class="btn btn-gold gate-submit" id="gateSubmit" data-t="gate_submit"></button>
      <button type="button" class="gate-skip" id="gateSkip" data-t="gate_skip"></button>
      <p class="flow-note" id="flowNoteNew"><span class="flow-ico" aria-hidden="true"></span><span data-t="form_note"></span></p>
      <p class="flow-note hidden" id="flowNoteBack"><span class="flow-ico" aria-hidden="true"></span><span data-t="form_note_back"></span></p>
    </div>
  </form>
</template>

<!-- ================= OFFER MODAL ================= -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <button class="gate-x" id="modalX" aria-label="Close">&times;</button>
    <button class="win-lang" id="modalLang" data-winlang></button>
    <div id="modalBody">
      <div class="hd">
        <h2 class="hd-t"><i class="hd-mark" aria-hidden="true"></i><span id="modalHead"></span></h2>
        <p class="hd-s" id="modalHeadSub"></p>
      </div>
      <div id="modalPath" class="wpath"></div>
      <div id="modalQA" data-step="st_m_q,st_m_ans"></div>
      <div class="hd hd-2" id="modalFormHd">
        <h2 class="hd-t"><i class="hd-mark" aria-hidden="true"></i><span data-t="form_h_details"></span></h2>
        <p class="hd-s" id="modalSub" data-t="form_sub_offer"></p>
      </div>
      <section class="need-box" data-step="st_m_form">
        <div class="need-hd"><h3 class="need-t" id="needHead"><i class="need-mark" aria-hidden="true"></i><span></span></h3><p class="need-s" id="needSub"></p></div>
        <p class="flow-note flow-note-tight"><span class="flow-ico" aria-hidden="true"></span><span data-t="form_all_req"></span></p>
        <p class="flow-note flow-note-ok flow-note-tight"><span class="flow-ico" aria-hidden="true"></span><span data-t="form_why_note"></span></p>
        <div id="modalSlot"></div>
      </section>
      <div class="modal-wa hidden" id="modalWa" data-step="st_m_wa">
        <p class="modal-wa-t" data-t="offer_wa_note"></p>
        <a class="btn btn-gold modal-wa-btn" id="modalWaBtn" target="_blank" rel="noopener" data-t="offer_wa_cta"></a>
        <p class="flow-note flow-note-wa"><span class="flow-ico" aria-hidden="true"></span><span data-t="wa_note"></span></p>
      </div>
    </div>
    <div class="modal-done hidden" id="modalDone">
      <div class="gate-tick">&#10003;</div>
      <div class="hd hd-c">
        <h2 class="hd-t"><i class="hd-mark" aria-hidden="true"></i><span data-t="gate_success"></span></h2>
        <p class="hd-s" data-t="gate_done_sub"></p>
      </div>
      <p class="gate-done-id"><span data-t="gate_reg_id"></span>: <strong id="regId2"></strong></p>
      <a class="btn btn-gold done-wa" id="modalWaBtn2" target="_blank" rel="noopener" data-t="gate_wa_cta"></a>
      <p class="flow-note flow-note-wa"><span class="flow-ico" aria-hidden="true"></span><span data-t="wa_note"></span></p>
    </div>
  </div>
</div>

<!-- ================= ORDER WINDOW ================= -->
<div id="orderWin" class="modal hidden">
  <div class="modal-card order-card">
    <button class="gate-x" id="orderX" aria-label="Close">&times;</button>
    <button class="win-lang" id="orderLang" data-winlang></button>
    <div id="orderBody">
      <div class="hd">
        <h2 class="hd-t"><i class="hd-mark" aria-hidden="true"></i><span data-t="order_title"></span></h2>
        <p class="hd-s" data-t="order_sub"></p>
      </div>
      <div id="orderPath" class="wpath"></div>
      <div class="hd hd-sm hd-2">
        <h3 class="hd-t"><i class="hd-mark" aria-hidden="true"></i><span data-t="order_pick_h"></span></h3>
        <p class="hd-s" data-t="order_pick_s"></p>
      </div>
      <div class="order-pick" id="orderPick" data-step="st_o_pick"></div>
      <div class="order-sum" id="orderSum" data-step="st_o_rate,st_o_sum"></div>
      <section class="need-box" data-step="st_o_form">
        <div class="need-hd"><h3 class="need-t" id="needHead"><i class="need-mark" aria-hidden="true"></i><span></span></h3><p class="need-s" id="needSub"></p></div>
        <p class="flow-note flow-note-tight"><span class="flow-ico" aria-hidden="true"></span><span data-t="form_all_req"></span></p>
        <p class="flow-note flow-note-ok flow-note-tight"><span class="flow-ico" aria-hidden="true"></span><span data-t="form_why_note"></span></p>
        <div id="orderSlot"></div>
      </section>
    </div>
    <div class="order-done hidden" id="orderDone">
      <div class="gate-tick">&#10003;</div>
      <div class="hd hd-c">
        <h2 class="hd-t"><i class="hd-mark" aria-hidden="true"></i><span data-t="order_done"></span></h2>
        <p class="hd-s" data-t="order_note"></p>
      </div>
      <p class="gate-done-id"><span data-t="order_no"></span>: <strong id="orderNo"></strong></p>
      <a class="btn btn-gold done-wa" id="orderWaBtn" target="_blank" rel="noopener" data-t="order_wa_cta"></a>
      <button class="btn btn-line" id="orderBooksAgain" data-t="see_books_again"></button>
      <p class="flow-note flow-note-wa"><span class="flow-ico" aria-hidden="true"></span><span data-t="wa_note"></span></p>
    </div>
  </div>
</div>

<!-- ================= LOOK INSIDE ================= -->
<div id="peek" class="peek hidden">
  <button class="peek-x" id="peekX" aria-label="Close">&times;</button>
  <div class="peek-stage">
    <button class="peek-nav peek-prev" id="peekPrev">&#8249;</button>
    <div class="peek-frame" id="peekFrame"></div>
    <button class="peek-nav peek-next" id="peekNext">&#8250;</button>
  </div>
  <div class="peek-foot">
    <span class="peek-name" id="peekName"></span>
    <span class="peek-count" id="peekCount"></span>
  </div>
</div>

<!-- ================= MAIN SITE ================= -->
<div id="site" class="site">

  <div class="topbar">
  <div class="strip" id="strip"><div class="strip-track" id="stripTrack"></div></div>

  <header class="header">
    <div class="wrap header-inner">
      <a href="#home" class="brand" data-nav="home">
        <img src="assets/img/rutuja-logo-sm.png" alt="ऋतुजा पब्लिकेशन" class="brand-logo">
        <span class="brand-text">
          <span class="brand-name">ऋतुजा पब्लिकेशन</span>
          <span class="brand-tag" data-t="brand_tag"></span>
        </span>
      </a>
      <nav class="nav" id="nav">
        <a href="#home" data-nav="home" data-t="nav_home"></a>
        <a href="#books" data-nav="books" data-t="nav_books"></a>
        <a href="#videos" data-nav="videos" data-t="nav_videos"></a>
        <a href="#experiences" data-nav="experiences" data-t="nav_experiences"></a>
        <a href="#offers" data-nav="offers" data-t="nav_offers"></a>
        <a href="#qa" data-nav="qa" data-t="nav_qa"></a>
        <a href="#authors" data-nav="authors" data-t="nav_authors"></a>
        <a href="#about" data-nav="about" data-t="nav_publication"></a>
        <a href="#contact" data-nav="contact" data-t="nav_contact"></a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" id="langToggle" title="भाषा / Language"><span id="langLabel">English</span></button>
        <a href="#cart" class="act act-list" id="navCart" data-nav="cart">
          <span class="act-i">&#9776;</span><span class="act-t" data-t="cart"></span><b id="cartCount">0</b></a>
        <a href="#" class="act act-order" id="navOrder">
          <span class="act-i">&#10148;</span><span class="act-t" data-t="order_btn"></span></a>
        <button class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false">
          <span class="menu-lines"><span></span><span></span><span></span></span>
          <span class="menu-word" data-t="menu_open"></span>
        </button>
      </div>
    </div>
  </header>
  </div>

  <main id="main">
    <section class="page active" id="page-home">
      <div class="story" id="story">
        <div class="story-track" id="storyTrack"></div>
      </div>
      <div class="story-dots" id="storyDots"></div>

      <div class="hero"><div class="wrap hero-inner">
        <div class="hero-btns">
          <button class="cta cta-books" data-nav="books"><span class="cta-rim" aria-hidden="true"></span>
            <span class="cta-txt">
              <b><span class="cta-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2.6 4.2 22 12 2.6 19.8l3.1-7.8z"/></svg></span><span data-t="nav_books"></span></b>
              <i data-t="btn_books_sub"></i>
            </span>
          </button>

          <button class="cta cta-video" data-nav="videos"><span class="cta-rim" aria-hidden="true"></span>
            <span class="cv-orb" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M8.4 5.6v12.8L19.4 12z"/></svg>
            </span>
            <span class="cv-txt" data-t="btn_videos"></span>
          </button>

          <button class="cta cta-order" id="heroOrder"><span class="cta-rim" aria-hidden="true"></span>
            <span class="cta-txt">
              <b><span class="cta-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2.6 4.2 22 12 2.6 19.8l3.1-7.8z"/></svg></span><span data-t="order_btn"></span></b>
              <i data-t="btn_order_sub"></i>
            </span>
          </button>
        </div>
      </div></div>

      <div class="wrap">
        <h2 class="sec-title" data-t="books_standard"></h2>
        <div class="std-grid" id="stdGrid"></div>

        <h2 class="sec-title" data-t="offer_hook_head"></h2>
        <p class="sec-sub" data-t="offer_hook_sub"></p>
        <div class="offer-grid" id="offerGrid"></div>

        <h2 class="sec-title" data-t="books_featured"></h2>
        <div class="book-grid" id="featGrid"></div>

        <h2 class="sec-title" data-t="explore_head"></h2>
        <p class="sec-sub" data-t="explore_sub"></p>
        <div class="ex-grid" id="exploreGrid"></div>

      </div>

      <div class="media-wide">
        <h2 class="sec-title" data-t="videos_title"></h2>
        <div class="carousel" id="vidCar"></div>

        <h2 class="sec-title" data-t="ads_title"></h2>
        <div class="carousel" id="adCar"></div>
      </div>

      <div class="wrap">

        <h2 class="sec-title" data-t="exp_title"></h2>
        <div class="placeholder" data-phase="9">Phase 9</div>
      </div>
    </section>

    <section class="page" id="page-books"><div class="wrap">
      <div class="hd hd-page"><h1 class="hd-t"><i class="hd-mark" aria-hidden="true"></i><span data-t="books_title"></span></h1><p class="hd-s" data-t="books_sub"></p></div>
        <div id="booksPath" class="wpath"></div>
      <div class="sample-note hidden" id="sampleNote" data-t="books_sample"></div>

      <div class="filters" data-step="st_k_filter">
        <div class="fbar">
          <input type="search" id="bSearch" class="fsearch" placeholder="">
          <select id="fStd" class="fsel"></select>
          <select id="fMed" class="fsel"></select>
          <select id="fSub" class="fsel"></select>
          <select id="fSort" class="fsel"></select>
          <button class="fclear" id="fClear" data-t="books_clear"></button>
        </div>
        <p class="fcount"><strong id="bCount">0</strong> <span data-t="books_count"></span></p>
      </div>

      <div class="book-grid" id="bookGrid" data-step="st_k_list"></div>
      <p class="book-none hidden" id="bookNone" data-t="books_none"></p>
    </div></section>

    <section class="page" id="page-book"><div class="wrap">
      <button class="back-link" data-nav="books" data-t="book_back"></button>
      <div id="bookDetail"></div>
    </div></section>
    <section class="page" id="page-videos"><div class="media-wide">
      <div class="hd hd-page"><h1 class="hd-t"><i class="hd-mark" aria-hidden="true"></i><span data-t="videos_title"></span></h1><p class="hd-s" data-t="videos_sub"></p></div>
      <div id="vidPath" class="wpath"></div>
      <div class="carousel" id="vidCar2" data-step="st_v_car"></div>
      <div class="vid-grid" id="vidGrid" data-step="st_v_one"></div>
    </div></section>
    <section class="page" id="page-experiences"><div class="wrap"><div class="hd hd-page"><h1 class="hd-t"><i class="hd-mark" aria-hidden="true"></i><span data-t="exp_title"></span></h1><p class="hd-s" data-t="exp_sub"></p></div><div class="placeholder" data-phase="9">Phase 9</div></div></section>
    <section class="page" id="page-offers"><div class="wrap"><div class="hd hd-page"><h1 class="hd-t"><i class="hd-mark" aria-hidden="true"></i><span data-t="offers_title"></span></h1><p class="hd-s" data-t="offer_hook_sub"></p></div><div class="offer-grid" id="offerGrid2"></div>
      <div class="hd hd-page"><h2 class="hd-t"><i class="hd-mark" aria-hidden="true"></i><span data-t="price_title"></span></h2><p class="hd-s" data-t="offers_sub2"></p></div>
      <div class="slab-wrap" id="slabTable"></div></div></section>
    <section class="page" id="page-qa"><div class="wrap">
      <div class="hd hd-page">
        <h1 class="hd-t"><i class="hd-mark" aria-hidden="true"></i><span data-t="qa_title"></span></h1>
        <p class="hd-s" data-t="qa_intro"></p>
      </div>
      <div id="qaPath" class="wpath"></div>
      <div id="qaBody"></div>
      <div class="qa-ask" data-step="st_q_ask">
        <label class="qa-ask-h" data-t="qa_ask"></label>
        <textarea id="qaAsk" class="qa-ask-in" rows="3" maxlength="400"></textarea>
        <button class="btn btn-gold qa-ask-btn" id="qaSend" data-t="qa_submit"></button>
      </div>
    </div></section>
    <section class="page" id="page-authors"><div class="wrap"><div class="hd hd-page"><h1 class="hd-t"><i class="hd-mark" aria-hidden="true"></i><span data-t="author_title"></span></h1><p class="hd-s" data-t="author_sub"></p></div><div class="placeholder" data-phase="10">Phase 10</div></div></section>
    <section class="page" id="page-about"><div class="wrap"><div class="hd hd-page"><h1 class="hd-t"><i class="hd-mark" aria-hidden="true"></i><span data-t="pub_title"></span></h1><p class="hd-s" data-t="pub_sub"></p></div><div class="placeholder" data-phase="10">Phase 10</div></div></section>
    <section class="page" id="page-cart"><div class="wrap">
      <div class="hd hd-page"><h1 class="hd-t"><i class="hd-mark" aria-hidden="true"></i><span data-t="cart_title"></span></h1><p class="hd-s" data-t="cart_sub"></p></div>
      <div id="cartBody"></div>
    </div></section>

    <section class="page" id="page-contact"><div class="wrap"><div class="hd hd-page"><h1 class="hd-t"><i class="hd-mark" aria-hidden="true"></i><span data-t="contact_title"></span></h1><p class="hd-s" data-t="contact_sub"></p></div><div class="contact-grid" id="contactGrid"></div></div></section>
  </main>

  <footer class="footer"><div class="wrap footer-inner">
    <div><p class="footer-name" data-t="pub_name"></p><p class="footer-addr" id="footerAddr"></p></div>
    <p class="footer-copy">© <span id="year"></span> <span data-t="common_copyright"></span> · <span id="verBadge" class="ver"></span></p>
  </div></footer>

  <div class="cart-bar hidden" id="cartBar">
    <span class="cart-bar-info"><b id="cartBarN">0</b> <span data-t="cart_books"></span> &nbsp;·&nbsp; <b id="cartBarT">₹0</b></span>
    <button class="cart-bar-btn" data-nav="cart" data-t="cart_see_list"></button>
  </div>

  <a class="wa-float" id="waFloat" href="#" target="_blank" rel="noopener" aria-label="WhatsApp">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M17.47 14.38c-.3-.15-1.75-.86-2.02-.96-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.22-.65.07-.3-.15-1.25-.46-2.38-1.47-.88-.78-1.47-1.75-1.65-2.05-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37s-1.04 1.01-1.04 2.47 1.06 2.86 1.21 3.06c.15.2 2.09 3.2 5.07 4.49.71.3 1.26.49 1.69.63.71.22 1.36.19 1.87.12.57-.09 1.75-.72 2-1.41.25-.69.25-1.29.17-1.41-.07-.12-.27-.2-.57-.35zM12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm0 18.13c-1.53 0-3.03-.41-4.34-1.19l-.31-.18-3.22.84.86-3.14-.2-.32a8.16 8.16 0 01-1.25-4.35c0-4.53 3.69-8.22 8.22-8.22s8.22 3.69 8.22 8.22-3.69 8.22-8.22 8.22z"/></svg>
  </a>
</div>

<script src="assets/js/app.js?v=15b"></script>
</body>
</html>
