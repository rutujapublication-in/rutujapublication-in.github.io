<!-- The font CSS is fetched as a preload so it starts at the same moment
     as the stylesheet rather than waiting behind it. Three weights were
     being pulled for Lora and five for Mukta; the site uses far fewer, and
     every unused weight is another file over a rural connection.

     display=swap still means Devanagari paints in a fallback first and
     reflows when Mukta lands — which on Section 1 is a centred quote, so
     the shift shows. Fewer and earlier files is the part that can be
     fixed here without risking a page that never gets its font. -->
<!-- the fonts do not hold up the first paint: the sheet is fetched as a
     preload and becomes a stylesheet once it lands, so the page draws in
     its fallback face immediately and swaps when the webfont arrives -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mukta:wght@400;500;600;700;800&family=Lora:wght@400;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mukta:wght@400;500;600;700;800&family=Lora:wght@400;600&display=swap"></noscript>
<!-- The stylesheet loads normally, blocking, on purpose.

     v18v deferred it behind a small block of inline rules. That made the
     page paint in about a fifth of a second — but with only those rules
     applied, so every section rendered unstyled and then snapped into
     place when the real sheet arrived. On a reload the sheet was cached
     and the jump vanished, which is exactly the "displaced at first,
     correct after refresh" fault.

     The premise was wrong as well: GitHub Pages gzips, so the sheet is
     64 KB over the wire, not 270. The whole blocking payload is 136 KB —
     about 1.1s on rural 4G. That is worth waiting for in exchange for a
     page that is correct the moment it appears. -->
<!-- the data is asked for at the same time as the scripts, so it is not a
     second round trip after app.js has parsed -->
<link rel="preload" as="fetch" type="application/json" crossorigin href="data/content.json?v=v23f">
<link rel="preload" as="fetch" type="application/json" crossorigin href="data/sitetext.json?v=v23f">
<link rel="preload" as="fetch" type="application/json" crossorigin href="data/story.json?v=v23f">
<link rel="preload" as="script" href="assets/js/app.js?v=23f">
